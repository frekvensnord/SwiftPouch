name: Interpreter iOS 27 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Xcode 27 / Swift 6.4
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Prepare CI paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'CI_LOG_DIR=%s\n' "$RUNNER_TEMP/interpreter-ci-logs" >> "$GITHUB_ENV"
          printf 'CI_DERIVED_DATA=%s\n' "$RUNNER_TEMP/interpreter-derived-data" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/interpreter-ci-logs"

      - name: Select and verify Xcode 27 toolchain
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
          XCODE_INFO="$(xcodebuild -version)"
          SWIFT_INFO="$(swift --version)"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

          {
            xcode-select -p
            printf '%s\n' "$XCODE_INFO"
            printf '%s\n' "$SWIFT_INFO"
            printf 'iOS SDK: %s\n' "$IOS_SDK_VERSION"
          } | tee "$CI_LOG_DIR/toolchain.txt"

          grep -Eq '^Xcode 27\.' <<< "$XCODE_INFO"
          grep -Eq 'Apple Swift version 6\.4([ .]|$)' <<< "$SWIFT_INFO"
          grep -Eq '^27\.' <<< "$IOS_SDK_VERSION"

      - name: Resolve Swift package dependencies
        working-directory: SwiftInterpreterCore
        shell: bash
        run: |
          set -euo pipefail
          swift package resolve 2>&1 | tee "$CI_LOG_DIR/swift-package-resolve.log"
          swift package show-dependencies --format json \
            > "$CI_LOG_DIR/swift-package-dependencies.json"

      - name: Run core tests
        working-directory: SwiftInterpreterCore
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee "$CI_LOG_DIR/swift-test.log"

      - name: Resolve host project dependencies
        id: host_resolve
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project SwiftInterpreterHost/SwiftInterpreterHost.xcodeproj \
            -scheme SwiftInterpreterHost \
            -resolvePackageDependencies \
            2>&1 | tee "$CI_LOG_DIR/xcode-resolve.log"

      - name: Build iOS host for device SDK
        id: host_build
        if: ${{ !cancelled() && steps.host_resolve.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project SwiftInterpreterHost/SwiftInterpreterHost.xcodeproj \
            -scheme SwiftInterpreterHost \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -showBuildSettings \
            > "$CI_LOG_DIR/host-build-settings.log"
          xcodebuild \
            -project SwiftInterpreterHost/SwiftInterpreterHost.xcodeproj \
            -scheme SwiftInterpreterHost \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CI_DERIVED_DATA" \
            -disableAutomaticPackageResolution \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            build \
            2>&1 | tee "$CI_LOG_DIR/ios-host-build.log"

          test -d "$CI_DERIVED_DATA/Build/Products/Debug-iphoneos/SwiftInterpreterHost.app"

      - name: Capture xcodebuild backtrace on host failure
        if: ${{ failure() && steps.host_build.outcome == 'failure' }}
        shell: bash
        run: |
          xcrun lldb --batch \
            -o run \
            -o 'thread backtrace all' \
            -- "$(xcrun --find xcodebuild)" \
            -project SwiftInterpreterHost/SwiftInterpreterHost.xcodeproj \
            -scheme SwiftInterpreterHost \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -showBuildSettings \
            > "$CI_LOG_DIR/xcodebuild-backtrace.log" 2>&1 || true

      - name: Collect xcodebuild crash diagnostics
        if: failure()
        shell: bash
        run: |
          for reports in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if test -d "$reports"; then
              find "$reports" -maxdepth 1 -type f \( -iname '*xcodebuild*' -o -iname '*xcbuild*' \) \
                -exec cp {} "$CI_LOG_DIR/" \;
            fi
          done

      - name: Upload toolchain, dependency locks, logs, and unsigned host build
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: interpreter-ios27-ci-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/interpreter-ci-logs/
            SwiftInterpreterCore/Package.resolved
            SwiftInterpreterHost/SwiftInterpreterHost.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            ${{ runner.temp }}/interpreter-derived-data/Build/Products/Debug-iphoneos/SwiftInterpreterHost.app/
